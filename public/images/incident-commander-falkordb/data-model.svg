<title id="t">Incident Commander world graph data model</title>
<desc id="d">Person ON_CALL Team, Team OWNS Service, Incident HAS Symptom ON Service, Change or Expiry CHANGES or EXPIRES_ON Service, Service DEPENDS_ON and OBSERVED_CALL Service, and the derived IMPACTS edge from callee to caller that exists only in as-of snapshots.</desc>
