<text x="24" y="396" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#525252">Bitemporal: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">valid_from</tspan>, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">valid_to</tspan> and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">recorded_at</tspan> on DEPENDS_ON, OWNS, ON_CALL and Change.</text>
